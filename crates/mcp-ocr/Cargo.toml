[package]
name = "mcp-ocr"
description = "Contract C backend: read-only OCR (image → text) MCP server (SPEC §4.2, STACK.md §3)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mcp-ocr"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum.workspace = true
tokio = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27.0", default-features = false }
tempfile = "3.27.0"
text2num = "2.8.0"

[dev-dependencies]
# Client side for the stdio round-trip test against this crate's own binary.
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-child-process",
] }
