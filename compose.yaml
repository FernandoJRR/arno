# One service per part (SPEC §5.7, STACK.md §6). Secrets come from env vars —
# create a `.env` beside this file (excluded from VCS) with at least:
#   HARNESS_API_CLIENT_TOKENS=<client>:<token>[,...]
# Ollama stays on the host and is reached via host-gateway.
name: arno

services:
  harness:
    build:
      context: .
      dockerfile: docker/harness.Dockerfile
      args:
        HARNESS_API_PORT: ${HARNESS_API_PORT:-8080}
    image: arno-harness
    # Published to localhost only, for host-side adapters (e.g. adapter-cli)
    # — not exposed beyond the host (SPEC decision #2; tune BIND vars via
    # .env when you expose through a VPN).
    ports:
      - "127.0.0.1:${HARNESS_API_PORT:-8080}:${HARNESS_API_PORT:-8080}"
    environment:
      HARNESS_API_CLIENT_TOKENS: ${HARNESS_API_CLIENT_TOKENS:?set in .env}
      HARNESS_API_BIND: ${HARNESS_API_BIND:-0.0.0.0:${HARNESS_API_PORT:-8080}}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      # Raised from 120s: a cold model load alone can take ~42s, and a real
      # order adds prompt + tool schemas + history on top.
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-180}
      # Plugins (SPEC §4.5, §11 #21): one manifest + optional env file per
      # MCP backend in ./config/plugins. Secrets stay in those env files and
      # never enter this environment.
      PLUGINS_DIR: /config/plugins
      PLUGINS_REPORT_PATH: /data/arno-plugins-report.json
      ROUTER_ENABLED: ${ROUTER_ENABLED:-false}
      HARNESS_TIMEZONE: ${HARNESS_TIMEZONE:-UTC}
      # Non-owned name on purpose: anything HARNESS_*-prefixed is rejected by
      # the harness's own strict env validator (SPEC §5.7), even if unread.
      HEALTHCHECK_PORT: ${HARNESS_API_PORT:-8080}
      # Ephemeral scratch dir for inbound image attachments (SPEC §4.1) —
      # shared with mcp-ocr via the `attachments` named volume below; the
      # harness owns this knob, mcp-ocr owns its own MCP_OCR_ATTACH_DIR
      # pointed at the same mount (SPEC §5.7 "one knob, one owner").
      ATTACH_DIR: /attachments
      # M3 (SPEC §11, §12.1, §12.2): the harness's own memory of what backends
      # have declared, its trail of executed writes, and the broader
      # conversation/tool-call transcript. All three paths must live on the
      # volume below — everything else in this compose file is legitimately
      # restart-clears (AGENTS.md #7); these three are the deliberate,
      # narrowly-scoped exceptions.
      TOOL_POLICY_PATH: /data/arno-tool-policy.json
      AUDIT_LOG_PATH: /data/arno-audit.jsonl
      TRANSCRIPT_LOG_PATH: /data/arno-transcript.jsonl
      # Log rotation (SPEC §11 decision #15). Defaults: 2 MiB audit, 10 MiB
      # transcript, keep 12 segments, verify-on-boot off. Rotation fires at
      # boot: segments land as arno-<store>-<UTC ts>.jsonl inside this same
      # volume and LOG_KEEP_SEGMENTS prunes the oldest there.
      AUDIT_LOG_ROTATE_BYTES: ${AUDIT_LOG_ROTATE_BYTES:-2097152}
      TRANSCRIPT_LOG_ROTATE_BYTES: ${TRANSCRIPT_LOG_ROTATE_BYTES:-10485760}
      LOG_KEEP_SEGMENTS: ${LOG_KEEP_SEGMENTS:-12}
      LOG_VERIFY_ON_BOOT: ${LOG_VERIFY_ON_BOOT:-false}
      # RUST_LOG: debug
    volumes:
      # Bind-mounted (not a named volume) so the tool policy / audit log /
      # transcript are plain files at ./data on the host — inspectable with
      # cat/jq/tail directly, no `docker run` indirection needed. Contains
      # real finance data (AGENTS.md #7 exceptions) — gitignored.
      - ./data:/data
      # Named (not bind-mounted, unlike ./data above): transient sensitive
      # images, not durable state — cleared on `down -v`, purged again at
      # harness boot regardless (SPEC §4.1). Shared with mcp-ocr below.
      - attachments:/attachments
      # Plugin manifests and per-plugin env files, read-only.
      - ./config/plugins:/config/plugins:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mcp-linux:
        condition: service_healthy
      mcp-ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${HEALTHCHECK_PORT:-8080}/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mcp-linux:
    build:
      context: .
      dockerfile: docker/linux-mcp.Dockerfile
      args:
        MCP_LINUX_PORT: ${MCP_LINUX_PORT:-9001}
    image: arno-linux-mcp
    environment:
      MCP_LINUX_PORT: ${MCP_LINUX_PORT:-9001}
      MCP_LINUX_BIND: ${MCP_LINUX_BIND:-0.0.0.0:${MCP_LINUX_PORT:-9001}}
    healthcheck:
      # Minimal JSON-RPC initialize — empirically verified to return HTTP 200
      # (a bare ping without a session gets rejected with 422).
      test: ["CMD-SHELL", "curl -fsS -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"0\"}}}' http://127.0.0.1:$${MCP_LINUX_PORT:-9001}/mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mcp-ocr:
    build:
      context: .
      dockerfile: docker/ocr-mcp.Dockerfile
      args:
        MCP_OCR_PORT: ${MCP_OCR_PORT:-9002}
    image: arno-ocr-mcp
    environment:
      MCP_OCR_PORT: ${MCP_OCR_PORT:-9002}
      MCP_OCR_BIND: ${MCP_OCR_BIND:-0.0.0.0:${MCP_OCR_PORT:-9002}}
      # Same scratch volume as the harness's ATTACH_DIR — each side names its
      # own mount path (SPEC §5.7 "one knob, one owner").
      MCP_OCR_ATTACH_DIR: /attachments
      MCP_OCR_LANG: eng+spa   # bills may be Spanish — see .env.example
      MCP_OCR_PREPROCESS: ${MCP_OCR_PREPROCESS:-on}
    volumes:
      - attachments:/attachments
    healthcheck:
      # Same minimal JSON-RPC initialize probe as mcp-linux, above.
      test: ["CMD-SHELL", "curl -fsS -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"0\"}}}' http://127.0.0.1:$${MCP_OCR_PORT:-9002}/mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  telegram-adapter:
    build:
      context: .
      dockerfile: docker/telegram-adapter.Dockerfile
    image: arno-telegram-adapter
    # Outbound-only long-polling (getUpdates) — no ports published. Exactly
    # one replica: a second poller on the same bot token gets HTTP 409 from
    # Telegram (SPEC §5.1) — never scale this service.
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:?set in .env}
      HARNESS_API_URL: http://harness:${HARNESS_API_PORT:-8080}
      HARNESS_API_TOKEN: "${TELEGRAM_HARNESS_API_TOKEN:?set in .env, matching a telegram: entry in HARNESS_API_CLIENT_TOKENS}"
    depends_on:
      harness:
        condition: service_healthy
    healthcheck:
      # No HTTP surface to probe (outbound-only) — process-liveness only
      # (STACK.md §6).
      test: ["CMD-SHELL", "pgrep -f adapter-telegram || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# The one stateful path in this topology (M3, SPEC §12.1/§12.2, AGENTS.md #7):
# the tool-safety policy, the hash-chained audit log, and the transcript all
# must survive a container recreate. Bind-mounted at ./data (harness service,
# above) rather than a named volume, so it's host-visible.

volumes:
  # Ephemeral scratch for inbound image attachments (SPEC §4.1): named, not
  # bind-mounted, because these are transient sensitive images rather than
  # durable state — `docker compose down -v` discards them outright, and the
  # harness purges the whole directory again at every boot regardless.
  # Shared by harness (ATTACH_DIR) and mcp-ocr (MCP_OCR_ATTACH_DIR); both
  # containers run as the same uid (docker/harness.Dockerfile,
  # docker/ocr-mcp.Dockerfile) so the harness's 0600 files stay readable
  # across the container boundary.
  attachments:
