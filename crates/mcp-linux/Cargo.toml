[package]
name = "mcp-linux"
description = "Contract C backend: read-only Linux diagnostics MCP server (SPEC §4.2, STACK.md §3)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mcp-linux"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum.workspace = true
tokio = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
nix = { version = "0.31", features = ["fs"] }

[dev-dependencies]
# Client side for the stdio round-trip test against this crate's own binary.
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-child-process",
] }
