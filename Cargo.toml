[workspace]
resolver = "3"
members = ["crates/contract", "crates/harness", "crates/adapter-cli", "crates/adapter-telegram", "crates/mcp-linux"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
contract = { path = "crates/contract" }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand = "0.10"
subtle = "2.6"
lru = "0.18"
clap = { version = "4.6", features = ["derive", "env"] }
async-trait = "0.1"
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = "thin"
